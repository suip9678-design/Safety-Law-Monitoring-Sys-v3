# =====================================================================
#  안전보건 법령·고시 개정 추적 시스템 v3
# =====================================================================
#  실제 접속 정보(주소/계정/비밀번호, API 인증키)는 이 파일에 직접 적지 말고
#  환경변수나 application-local.yml 에 두고 이 파일은 기본값만 유지한다.
# =====================================================================

server:
  port: ${SERVER_PORT:8000}
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: safety-law-monitor

  # 기존 Python(FastAPI) 버전이 내려주던 JSON 형식을 그대로 유지한다.
  # 프론트엔드(frontend/app.js)가 snake_case 키를 그대로 읽고 있어서,
  # 이 설정을 바꾸면 화면이 전부 깨진다.
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: always

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 10g 는 서비스명 방식(//host:port/service)보다 SID 방식이 흔하다.
    #   SID 방식     : jdbc:oracle:thin:@host:1521:ORCL
    #   서비스명 방식 : jdbc:oracle:thin:@//host:1521/ORCL
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${DB_USERNAME:safety}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: SafetyLawPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      # 오래된 드라이버에서는 Connection.isValid() 가 신뢰하기 어려워
      # 검증 쿼리를 명시한다.
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        # 접속 시 ORA-28040(No matching authentication protocol)이 발생하면
        # 아래 주석을 해제한다. 드라이버가 구버전 인증 프로토콜을 허용하게 한다.
        # oracle.net.allowedLogonVersion: 8
        oracle.jdbc.ReadTimeout: 60000
        oracle.net.CONNECT_TIMEOUT: 20000

  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.safetylaw.monitor.domain
  configuration:
    # DB 의 SOURCE_TYPE 컬럼을 자바의 sourceType 필드로 자동 연결한다.
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-statement-timeout: 60
    call-setters-on-nulls: true

logging:
  level:
    root: INFO
    com.safetylaw.monitor: INFO
    # SQL 을 콘솔에서 보고 싶으면 DEBUG 로 바꾼다.
    com.safetylaw.monitor.mapper: INFO

# ---------------------------------------------------------------------
#  애플리케이션 고유 설정
#  (아래 값들은 대부분 실행 중 설정 화면에서 바꿀 수 있으며, DB 의
#   APP_SETTINGS 테이블에 저장된 값이 이 기본값보다 우선한다.)
# ---------------------------------------------------------------------
app:
  # 국가법령정보 공동활용 API 인증키(OC). 비어 있으면 데모 모드로 동작한다.
  law-api-oc: ${LAW_API_OC:}
  law-api-base-url: https://www.law.go.kr

  # 자동 동기화 주기(시간). 0 이면 자동 동기화를 하지 않는다.
  auto-sync-interval-hours: ${AUTO_SYNC_INTERVAL_HOURS:24}

  # 매일 정기 작업이 도는 시각(KST). 컴퓨터가 그 시각에 꺼져 있었으면
  # 서버가 켜질 때 한 번 대신 실행한다(catch-up).
  daily-maintenance-cron: "0 0 1 * * *"
  timezone: Asia/Seoul

  # 신규 제정 고시 자동 탐지: 소관부처 + 키워드 이중 필터
  new-admrul:
    keywords: 안전보건,산업안전,중대재해,위험성평가,유해위험,보건관리,안전관리
    department: 고용노동부
    # YYYYMMDD. 이 날짜 이전 공포분은 후보에서 제외한다. 비우면 전체 대상.
    since-date: ""

  # 전체 법령 본문 자동 캐시. 상세조회를 수천 건 호출하는 무거운 작업이라
  # 기본은 꺼둔다.
  full-law-cache-enabled: ${FULL_LAW_CACHE_ENABLED:false}

  # 대시보드 접근 보호. 둘 다 채워야 로그인 요구가 켜진다.
  dashboard:
    username: ${DASHBOARD_USERNAME:}
    password: ${DASHBOARD_PASSWORD:}

  # 메일 발송. 설정 화면에서 바꾼 값이 DB 에 있으면 그쪽이 우선하므로
  # 여기 값은 최초 기본값으로만 쓰인다.
  email:
    enabled: ${FEATURE_EMAIL_ENABLED:true}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    use-tls: ${SMTP_USE_TLS:true}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    # 쉼표로 구분
    alert-recipients: ${ALERT_EMAILS:}

  news:
    enabled: ${NEWS_TICKER_ENABLED:true}
    fetch-interval-hours: ${NEWS_FETCH_INTERVAL_HOURS:3}
    max-items-per-category: ${NEWS_MAX_ITEMS_PER_CATEGORY:30}
    sources:
      moel: https://news.google.com/rss/search?q=%EA%B3%A0%EC%9A%A9%EB%85%B8%EB%8F%99%EB%B6%80%20%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4&hl=ko&gl=KR&ceid=KR:ko
      kosha: https://news.google.com/rss/search?q=%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B3%B5%EB%8B%A8&hl=ko&gl=KR&ceid=KR:ko
      accident: https://news.google.com/rss/search?q=%EC%A4%91%EB%8C%80%EC%9E%AC%ED%95%B4&hl=ko&gl=KR&ceid=KR:ko

---
# ---------------------------------------------------------------------
#  로컬 개발용 프로파일 (Oracle 없이 구동)
#    실행: --spring.profiles.active=local
#  H2 를 Oracle 호환 모드로 띄워 스키마를 그대로 적용한다.
#  주의: H2 에서 동작해도 실제 10g 에서 동작한다는 보장은 아니다.
#        최종 확인은 반드시 실제 Oracle 에서 해야 한다.
# ---------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:safetylaw;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
